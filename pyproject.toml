[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
name = "monda"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.11"


[tool.pixi.pypi-dependencies]
monda = { path = ".", editable = true }
python-dateutil = ">=2.9.0"

[tool.pixi.tasks]
